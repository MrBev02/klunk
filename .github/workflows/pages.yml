# Build Klunk and publish it to GitHub Pages.
#
# Only dist/ is published. The single-file build (dist-single/) is for a faculty
# shared drive and is produced on demand with `npm run build:single`, not here.
#
# Nothing in this workflow has access to exam content, because no exam content is
# in this repository. If that ever stops being true, this pipeline becomes a
# disclosure route and needs revisiting.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck runs as part of `npm run build`, so a type error fails the
      # deploy rather than shipping.
      - run: npm run build

      - uses: actions/configure-pages@v6

      # v4 stopped putting dotfiles in the artifact. dist/ is index.html and
      # four files under assets/, so there is nothing to lose by it, but a
      # build that starts emitting one would lose it silently.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # There is deliberately no `timeout:` here, because it cannot help. The
      # action clamps it — `Math.min(timeoutInput, MAX_TIMEOUT)` against a
      # hardcoded 600000 in src/internal/deployment.js — so ten minutes is the
      # longest this step can ever wait, and asking for twenty is silently
      # given ten. See #53: it was tried, and the run still aborted at 10m11s.
      - id: deployment
        uses: actions/deploy-pages@v5
