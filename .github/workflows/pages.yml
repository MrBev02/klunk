# Build Klunk and publish it to GitHub Pages.
#
# Only dist/ is published. The single-file build (dist-single/) is for a faculty
# shared drive and is produced on demand with `npm run build:single`, not here.
#
# Nothing in this workflow has access to exam content, because no exam content is
# in this repository. If that ever stops being true, this pipeline becomes a
# disclosure route and needs revisiting.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck runs as part of `npm run build`, so a type error fails the
      # deploy rather than shipping.
      - run: npm run build

      - uses: actions/configure-pages@v6

      # v4 stopped putting dotfiles in the artifact. dist/ is index.html and
      # four files under assets/, so there is nothing to lose by it, but a
      # build that starts emitting one would lose it silently.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A Pages deployment sits in `deployment_queued` until GitHub allocates a
  # runner to it. On 2026-08-06 that allocation became unreliable — four of six
  # runs failed, and the difference was only ever how long the wait was, never
  # anything about this repository. The artifact is 580 kB and had not changed
  # size in days.
  #
  #   cb1d19d   59 polls  ✓        d5e384c   63 polls  ✓
  #   5cc40ef  115 polls  ✗        e21484a  115 polls  ✗
  #   564fb33  121 polls  ✗        6e49055  116 polls  ✗
  #
  # Two things were tried against that and neither can work, so #53 records them
  # here rather than leaving the next person to find out the same way.
  #
  # `timeout:` is clamped. `Math.min(timeoutInput, MAX_TIMEOUT)` against a
  # hardcoded 600000 in the action's src/internal/deployment.js means ten
  # minutes is the longest this step can ever wait, and asking for twenty is
  # silently given ten. The run that tried it still aborted at 10m11s.
  #
  # And a retry is not a second draw from the queue. **A deployment is keyed by
  # the commit SHA** — `Created deployment for 8502df6…, ID: 8502df6…` — so a
  # second `deploy-pages` in the same job addresses the same deployment, which
  # the first attempt cancelled on its way out. It came back
  # `Deployment cancelled.` in six seconds.
  #
  # The same fact governs what to do when this fails: **re-running the job is
  # futile**, for exactly that reason. Only a new commit gets a new deployment,
  # so push one — `git commit --allow-empty` will do — rather than pressing
  # re-run and waiting for a deployment that is already dead.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
